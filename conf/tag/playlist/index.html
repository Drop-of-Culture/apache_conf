<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playlist</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f4f4f9;
            color: #333;
        }

        #video {
            width: 100%;
            max-width: 600px;
            background-color: #000;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }

        #controls {
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .control-btn {
            padding: 10px 16px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            background-color: #fff;
            cursor: pointer;
            font-size: 18px;
            font-weight: 600;
            line-height: 1;
            min-width: 48px;
        }

        .control-btn:hover {
            background-color: #eef2ff;
        }

        #playlist {
            width: 100%;
            max-width: 600px;
        }

        #playlist-items {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .playlist-item {
            padding: 15px;
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            text-align: left;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            -webkit-tap-highlight-color: transparent;
            font-size: 16px;
        }

        .playlist-item:hover {
            background-color: #eef2ff;
            border-color: #cbd5e1;
        }

        .playlist-item:active {
            transform: scale(0.98);
            background-color: #e0e7ff;
        }

        .playlist-item.playing {
            background-color: #dbeafe;
            border-color: #60a5fa;
            font-weight: 600;
        }

        #error-message {
            color: #dc2626;
            margin-top: 20px;
            font-weight: bold;
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }
            .playlist-item {
                padding: 12px;
                font-size: 14px;
            }
        }
    </style>
</head>

<body>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.js" integrity="sha512-+k1pnlgt4F1H8L7t3z95o3/KO+o78INEcXTbnoJQ/F2VqDVhWoaiVml/OEHv9HsVgxUaVW+IbiZPUJQfF/YxZw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<!-- Or if you want a more recent canary version -->
<!-- <script src="https://cdn.jsdelivr.net/npm/hls.js@canary"></script> -->
<video id="video" controls></video>
<div id="controls">
    <button id="prev-btn" class="control-btn" type="button" aria-label="Previous">⏮</button>
    <button id="play-pause-btn" class="control-btn" type="button" aria-label="Play">▶</button>
    <button id="next-btn" class="control-btn" type="button" aria-label="Next">⏭</button>
</div>
<div id="playlist">
    <div id="playlist-items">
    </div>
</div>
<div id="error-message"></div>
<script>
    let currentPlayingItem = null;
    let currentTrackIndex = -1;
    let playlistItems = [];

    const playPauseBtn = document.getElementById("play-pause-btn");
    const prevBtn = document.getElementById("prev-btn");
    const nextBtn = document.getElementById("next-btn");

    function setPlayingItem(div) {
        if (currentPlayingItem) {
            currentPlayingItem.classList.remove("playing");
        }
        currentPlayingItem = div;
        currentPlayingItem.classList.add("playing");

        currentTrackIndex = playlistItems.indexOf(div);
    }

    function updatePlayPauseButton() {
        playPauseBtn.textContent = video.paused ? "▶" : "⏸";
        playPauseBtn.setAttribute("aria-label", video.paused ? "Play" : "Pause");
    }

    function play_track_by_index(index) {
        if (playlistItems.length === 0) {
            return;
        }
        if (index < 0) {
            index = playlistItems.length - 1;
        }
        if (index >= playlistItems.length) {
            index = 0;
        }
        play_track(playlistItems[index]);
    }

    function play_track(div) {
        setPlayingItem(div);

        if(Hls.isSupported()) {
            // var hls = new Hls();
            const time = new Date().getTime();
            hls.loadSource('/track/' + div.dataset.track_id + '?' + time);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED,function() {
                video.play();
                updatePlayPauseButton();
            });
            hls.on(Hls.Events.MEDIA_ATTACHED, function () {
                video.play();
                updatePlayPauseButton();
            });
        }
            // hls.js is not supported on platforms that do not have Media Source Extensions (MSE) enabled.
            // When the browser has built-in HLS support (check using `canPlayType`), we can provide an HLS manifest (i.e. .m3u8 URL) directly to the video element throught the `src` property.
            // This is using the built-in support of the plain video element, without using hls.js.
            // Note: it would be more normal to wait on the 'canplay' event below however on Safari (where you are most likely to find built-in HLS support) the video.src URL must be on the user-driven
        // white-list before a 'canplay' event will be emitted; the last video event that can be reliably listened-for when the URL is not on the white-list is 'loadedmetadata'.
        else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            const time = new Date().getTime();
            video.src = '/track/' + div.dataset.track_id + '?' + time;
            video.addEventListener('loadedmetadata',function() {
                video.play();
                updatePlayPauseButton();
            });
        }
    }

    const match = document.cookie.match(new RegExp('(^| )dop_token=([^;]+)'));
    let dop_token = match ?
        match[2]:
        "dummy";
    const hls = new Hls({
        xhrSetup: xhr => {
            xhr.setRequestHeader('dop_token', dop_token);
        }
    });

    const errMsg = document.getElementById("error-message");
    errMsg.textContent = "";
    fetch('/playlist', {
        headers: {
            "Content-Type": "application/json",
            "dop_token": dop_token,
        },
    })
        .then((res) => {
            if (!res.ok) {
                throw new Error("Network Problem");
            }
            return res.json();
        })
        .then((json) => {
            console.log(json);
            const playlist = document.getElementById("playlist-items");
            playlist.innerHTML = "";
            let i = 1;

            json.tracks.forEach(element => {
                const div = document.createElement("div");
                div.innerHTML = element;
                div.className = "playlist-item";
                div.dataset.track_id = i.toString();
                div.onclick = () => {
                    play_track(div);
                }
                playlist.appendChild(div);
                playlistItems.push(div);
                i++;
            });
        })
        .catch(() => {
            errMsg.textContent =
                "Cannot Download Restricted Content!";
        });
    var video = document.getElementById('video');

    playPauseBtn.addEventListener("click", () => {
        if (video.paused) {
            if (currentTrackIndex === -1) {
                play_track_by_index(0);
                return;
            }
            video.play();
        } else {
            video.pause();
        }
        updatePlayPauseButton();
    });

    prevBtn.addEventListener("click", () => {
        if (playlistItems.length === 0) {
            return;
        }
        const targetIndex = currentTrackIndex === -1 ? 0 : currentTrackIndex - 1;
        play_track_by_index(targetIndex);
    });

    nextBtn.addEventListener("click", () => {
        if (playlistItems.length === 0) {
            return;
        }
        const targetIndex = currentTrackIndex === -1 ? 0 : currentTrackIndex + 1;
        play_track_by_index(targetIndex);
    });

    video.addEventListener("play", updatePlayPauseButton);
    video.addEventListener("pause", updatePlayPauseButton);
</script>
</body>
</html>
